server:
  port: 8080
spring:
  application:
    name: lfm-server
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/healthpiard}
    username: ${DB_USER:healthpiard}
    password: ${DB_PASSWORD:healthpiard}
  servlet:
    multipart:
      max-file-size: ${HEALTHPIARD_MAX_IMAGE_SIZE:20MB}
      max-request-size: ${HEALTHPIARD_MAX_REQUEST_SIZE:22MB}
mybatis:
  mapper-locations: classpath:/mappers/*.xml
healthpiard:
  ingest:
    storage-root: ${HEALTHPIARD_STORAGE_ROOT:./data/healthpiard}
    max-image-size-bytes: ${HEALTHPIARD_MAX_IMAGE_SIZE_BYTES:20971520}
management:
  endpoints:
    web:
      exposure:
        include: health,info
