plugins { id 'java'; id 'org.springframework.boot' version '3.5.7'; id 'io.spring.dependency-management' version '1.1.7' }
group='com.healthpiard'
version='0.7.0'
java { toolchain { languageVersion = JavaLanguageVersion.of(21) } }
repositories { mavenCentral() }
dependencies { implementation 'org.springframework.boot:spring-boot-starter-web'; implementation 'org.springframework.boot:spring-boot-starter-actuator'; implementation 'org.springframework.boot:spring-boot-starter-validation'; implementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter:3.0.5'; runtimeOnly 'org.postgresql:postgresql'; testImplementation 'org.springframework.boot:spring-boot-starter-test' }
tasks.named('test') { useJUnitPlatform() }
